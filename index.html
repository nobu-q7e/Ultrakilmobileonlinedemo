<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ULTRAKILL WEB PORT (mobile demo)</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#111;overflow:hidden;position:fixed;width:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;
    font-family:-apple-system,Helvetica,Arial,sans-serif;color:#fff}
  #unity-canvas{position:fixed;left:0;top:0;width:100%;height:100%;background:#231F20;display:block}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;z-index:50;text-align:center;padding:20px}
  #loading h1{font-size:20px;letter-spacing:2px;margin:0 0 14px;color:#ff3b30}
  #bar{width:70%;max-width:360px;height:8px;background:#333;border-radius:4px;overflow:hidden}
  #fill{height:100%;width:0;background:#ff3b30;transition:width .2s}
  #status{margin-top:12px;font-size:14px;color:#bbb;max-width:90%}
  #controls{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
  .zone{position:absolute;pointer-events:auto}
  #moveZone{left:0;bottom:0;width:40%;height:65%}
  #lookZone{right:0;top:0;width:60%;height:100%}
  #stickBase{position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none}
  #stickKnob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.45);left:31px;top:31px}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;text-align:center;line-height:1.1}
  .btn.on{background:rgba(255,59,48,.6)}
  .sq{border-radius:10px}
  #fire{right:max(18px,env(safe-area-inset-right));bottom:70px;width:82px;height:82px;font-size:14px;background:rgba(255,59,48,.28)}
  #alt{right:112px;bottom:38px;width:60px;height:60px}
  #jump{right:max(18px,env(safe-area-inset-right));bottom:162px;width:66px;height:66px}
  #dash{right:100px;bottom:130px;width:58px;height:58px}
  #slide{right:172px;bottom:96px;width:54px;height:54px}
  #punch{right:176px;bottom:160px;width:48px;height:48px}
  #hook{right:236px;bottom:122px;width:48px;height:48px}
  #pause{left:max(12px,env(safe-area-inset-left));top:12px;width:44px;height:34px}
  #wep{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
  #wep .btn{position:static;width:38px;height:34px;pointer-events:auto}
  #err{color:#ff8a80}
  #menuBtn{left:64px;top:12px;width:56px;height:34px}
  #controls.menu #moveZone{display:none}
  #controls.menu #lookZone{left:0;width:100%}
  #controls.menu #stickBase{display:none!important}
  #controls.menu #wep{display:none}
  #controls.menu .btn:not(#pause):not(#menuBtn){display:none}
  #rot{position:fixed;inset:0;z-index:60;background:#111;display:none;align-items:center;justify-content:center;text-align:center;font-size:18px}
  @media (orientation:portrait){#rot{display:flex}}
</style>
</head>
<body>
<canvas id="unity-canvas"></canvas>
<div id="loading"><h1>ULTRAKILL WEB PORT</h1><div id="bar"><div id="fill"></div></div><div id="status">Preparing…</div></div>
<div id="rot">Rotate your phone to landscape ↻</div>
<div id="controls">
  <div class="zone" id="moveZone"></div>
  <div class="zone" id="lookZone"></div>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div class="btn sq" id="pause" data-key="Escape" data-kc="27" data-code="Escape">ESC</div>
  <div class="btn sq" id="menuBtn">CURSOR</div>
  <div id="wep">
    <div class="btn sq" data-key="1" data-kc="49" data-code="Digit1">1</div>
    <div class="btn sq" data-key="2" data-kc="50" data-code="Digit2">2</div>
    <div class="btn sq" data-key="3" data-kc="51" data-code="Digit3">3</div>
    <div class="btn sq" data-key="4" data-kc="52" data-code="Digit4">4</div>
    <div class="btn sq" data-key="5" data-kc="53" data-code="Digit5">5</div>
  </div>
  <div class="btn" id="fire" data-mouse="0">FIRE</div>
  <div class="btn" id="alt" data-mouse="2">ALT</div>
  <div class="btn" id="jump" data-key=" " data-kc="32" data-code="Space">JUMP</div>
  <div class="btn" id="dash" data-key="Shift" data-kc="16" data-code="ShiftLeft">DASH</div>
  <div class="btn" id="slide" data-key="Control" data-kc="17" data-code="ControlLeft">SLIDE</div>
  <div class="btn" id="punch" data-key="f" data-kc="70" data-code="KeyF">PUNCH</div>
  <div class="btn" id="hook" data-key="r" data-kc="82" data-code="KeyR">HOOK</div>
</div>

<script>
/* ---- Fake pointer lock so Unity thinks the mouse is captured (iOS has no Pointer Lock API) ---- */
(function(){
  var locked=false, canvas=null;
  function canv(){return canvas||(canvas=document.getElementById('unity-canvas'));}
  Object.defineProperty(document,'pointerLockElement',{get:function(){return locked?canv():null;},configurable:true});
  Object.defineProperty(document,'mozPointerLockElement',{get:function(){return locked?canv():null;},configurable:true});
  Object.defineProperty(document,'webkitPointerLockElement',{get:function(){return locked?canv():null;},configurable:true});
  function fire(){['pointerlockchange','mozpointerlockchange','webkitpointerlockchange'].forEach(function(n){document.dispatchEvent(new Event(n));});}
  var req=function(){ if(!locked){locked=true; setTimeout(fire,0);} };
  Element.prototype.requestPointerLock=req; Element.prototype.mozRequestPointerLock=req; Element.prototype.webkitRequestPointerLock=req;
  var ex=function(){ if(locked){locked=false; setTimeout(fire,0);} };
  document.exitPointerLock=ex; document.mozExitPointerLock=ex; document.webkitExitPointerLock=ex;
  window.__isLocked=function(){return locked;};
})();
</script>

<script src="loader.js"></script>


<script>
/* ---- Touch controls (with menu/cursor mode) ---- */
(function(){
  var canvas=null;
  function C(){return canvas||(canvas=document.getElementById('unity-canvas'));}
  var controls=document.getElementById('controls');
  var held={};
  function key(type,k,kc,code){
    var e=new KeyboardEvent(type,{key:k,code:code||'',bubbles:true,cancelable:true});
    try{Object.defineProperty(e,'keyCode',{get:function(){return kc;}});Object.defineProperty(e,'which',{get:function(){return kc;}});}catch(x){}
    C().dispatchEvent(e);
  }
  function keyDown(k,kc,code){ if(held[k]) return; held[k]={kc:kc,code:code}; key('keydown',k,kc,code); }
  function keyUp(k,kc,code){ if(!held[k]) return; delete held[k]; key('keyup',k,kc,code); }
  function releaseAll(){ Object.keys(held).forEach(function(k){var h=held[k]; delete held[k]; key('keyup',k,h.kc,h.code);}); }
  var cx=innerWidth/2, cy=innerHeight/2;
  function mouse(type,btn,x,y,mx,my,bs){
    if(bs===undefined) bs=(type==='mousedown')?(1<<btn):0;
    var e=new MouseEvent(type,{bubbles:true,cancelable:true,clientX:x==null?cx:x,clientY:y==null?cy:y,button:btn||0,buttons:bs,view:window});
    try{Object.defineProperty(e,'movementX',{get:function(){return mx||0;}});Object.defineProperty(e,'movementY',{get:function(){return my||0;}});}catch(x){}
    C().dispatchEvent(e);
  }

  /* menu mode = cursor free (game not locked) OR forced via the CURSOR button */
  var forced=false, wasMenu=false;
  var mbtn=document.getElementById('menuBtn');
  function menuMode(){ return forced || !window.__isLocked(); }
  function refresh(){
    var m=menuMode();
    controls.classList.toggle('menu',m);
    mbtn.classList.toggle('on',forced);
    if(m && !wasMenu){ releaseAll(); stickReset(); }
    wasMenu=m;
  }
  document.addEventListener('pointerlockchange',refresh);
  setInterval(refresh,250);
  mbtn.addEventListener('touchstart',function(e){e.preventDefault();forced=!forced;refresh();},{passive:false});

  /* on-screen buttons */
  document.querySelectorAll('#controls .btn').forEach(function(b){
    if(b.id==='menuBtn') return;
    function down(ev){ev.preventDefault();b.classList.add('on');
      if(b.dataset.mouse!==undefined) mouse('mousedown',+b.dataset.mouse);
      else keyDown(b.dataset.key,+b.dataset.kc,b.dataset.code);}
    function up(ev){ev.preventDefault();b.classList.remove('on');
      if(b.dataset.mouse!==undefined) mouse('mouseup',+b.dataset.mouse);
      else keyUp(b.dataset.key,+b.dataset.kc,b.dataset.code);}
    b.addEventListener('touchstart',down,{passive:false});
    b.addEventListener('touchend',up,{passive:false});
    b.addEventListener('touchcancel',up,{passive:false});
  });

  /* move stick -> WASD (gameplay only) */
  var mz=document.getElementById('moveZone'), base=document.getElementById('stickBase'), knob=document.getElementById('stickKnob');
  var mId=null, ox=0, oy=0;
  var W={k:'w',kc:87,c:'KeyW'},A={k:'a',kc:65,c:'KeyA'},S={k:'s',kc:83,c:'KeyS'},D={k:'d',kc:68,c:'KeyD'};
  function setDir(o,on){ on?keyDown(o.k,o.kc,o.c):keyUp(o.k,o.kc,o.c); }
  function stickReset(){ mId=null; base.style.display='none'; knob.style.left='31px'; knob.style.top='31px'; setDir(W,0);setDir(A,0);setDir(S,0);setDir(D,0); }
  function stickUpdate(t){
    var dx=t.clientX-ox, dy=t.clientY-oy, m=Math.hypot(dx,dy), max=50;
    if(m>max){dx*=max/m;dy*=max/m;}
    knob.style.left=(31+dx)+'px'; knob.style.top=(31+dy)+'px';
    var th=14; setDir(W,dy<-th); setDir(S,dy>th); setDir(A,dx<-th); setDir(D,dx>th);
  }
  mz.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];mId=t.identifier;ox=t.clientX;oy=t.clientY;
    base.style.display='block';base.style.left=(ox-55)+'px';base.style.top=(oy-55)+'px';stickUpdate(t);},{passive:false});
  mz.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===mId)stickUpdate(e.changedTouches[i]);}},{passive:false});
  function mEnd(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===mId)stickReset();}}
  mz.addEventListener('touchend',mEnd,{passive:false});mz.addEventListener('touchcancel',mEnd,{passive:false});

  /* full-area pad: LOOK in gameplay, CURSOR (tap / drag / hold) in menus */
  var lz=document.getElementById('lookZone'), lId=null, lx=0, ly=0, lMode='look';
  var SENS=1.6;
  lz.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];
    lId=t.identifier; lx=t.clientX; ly=t.clientY; lMode=menuMode()?'menu':'look';
    if(lMode==='menu'){ mouse('mousemove',0,lx,ly,0,0,0); mouse('mousedown',0,lx,ly); }
  },{passive:false});
  lz.addEventListener('touchmove',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier!==lId)continue;
    var dx=(t.clientX-lx)*SENS, dy=(t.clientY-ly)*SENS; lx=t.clientX; ly=t.clientY;
    if(lMode==='menu') mouse('mousemove',0,t.clientX,t.clientY,dx,dy,1);
    else mouse('mousemove',0,cx,cy,dx,dy,0);
  }},{passive:false});
  function lEnd(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier!==lId)continue;lId=null;
    if(lMode==='menu'){
      mouse('mouseup',0,t.clientX,t.clientY);
      C().dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:t.clientX,clientY:t.clientY,view:window}));
    }
  }}
  lz.addEventListener('touchend',lEnd,{passive:false});lz.addEventListener('touchcancel',lEnd,{passive:false});

  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
  window.addEventListener('resize',function(){cx=innerWidth/2;cy=innerHeight/2;});
  refresh();
})();
</script>

<script>
/* ---- Boot: fetch Build files, gunzip in browser, start Unity ---- */
(function(){
  var statusEl=document.getElementById('status'), fill=document.getElementById('fill');
  function say(t,err){statusEl.textContent=t;if(err)statusEl.style.color='#ff8a80';}
  function prog(p){fill.style.width=Math.round(p*100)+'%';}
  async function get(urls){
    var bufs=[], total=0;
    for(var i=0;i<urls.length;i++){
      var r=await fetch(urls[i]);
      if(!r.ok) throw new Error('Could not load '+urls[i]+' ('+r.status+')');
      var b=await r.arrayBuffer(); bufs.push(b); total+=b.byteLength;
    }
    var blob=new Blob(bufs); bufs.length=0;
    var head=new Uint8Array(await blob.slice(0,2).arrayBuffer());
    if(head[0]===0x1f&&head[1]===0x8b){
      var s=blob.stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(s).blob();
    }
    return blob;
  }
  async function boot(){
    try{
      if(typeof DecompressionStream==='undefined'||typeof createUnityInstance==='undefined')
        throw new Error('Needs iOS 16.4+ Safari, and all the files must be in the same folder as index.html.');
      say('Loading engine…'); var fw=await get(['framework.bin']); prog(.1);
      say('Loading game code…'); var wasm=await get(['wasm.bin']); prog(.25);
      say('Loading game data (big)…'); var data=await get(['data.part00.bin','data.part01.bin','data.part02.bin']); prog(.5);
      say('Starting…');
      await createUnityInstance(document.getElementById('unity-canvas'),{
        dataUrl:URL.createObjectURL(data),
        frameworkUrl:URL.createObjectURL(fw),
        codeUrl:URL.createObjectURL(wasm),
        streamingAssetsUrl:'StreamingAssets',
        companyName:'Hakita and Cake Logic',
        productName:'ULTRAKILL WEB PORT',
        productVersion:'1.4',
        devicePixelRatio:1
      },function(p){prog(.5+p*.5);});
      document.getElementById('loading').style.display='none';
      document.getElementById('controls').style.display='block';
    }catch(e){ say('Error: '+(e&&e.message||e),true); console.error(e); }
  }
  window.addEventListener('load',boot);
})();
</script>
</body>
</html>
